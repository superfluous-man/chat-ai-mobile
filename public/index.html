<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6f2">
    <meta name="description" content="A private, personal AI chat.">
    <title>Private AI Chat</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <section class="login-view" id="login-view" hidden>
      <form class="login-card" id="login-form">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <h1>Private AI Chat</h1>
        <p>Your conversations stay in your database.</p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <label class="remember-row">
          <input id="remember" name="remember" type="checkbox" checked>
          <span>Remember me for 30 days</span>
        </label>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="primary-button" type="submit">Unlock</button>
      </form>
    </section>

    <div class="app-shell" id="app-shell" hidden>
      <div class="sidebar-scrim" id="sidebar-scrim"></div>
      <aside class="sidebar" id="sidebar" aria-label="Conversations">
        <div class="sidebar-header">
          <div class="brand"><span aria-hidden="true">✦</span> Private AI</div>
          <button class="icon-button mobile-only" id="close-sidebar" aria-label="Close conversations">×</button>
        </div>
        <button class="new-chat-button" id="new-chat" type="button"><span aria-hidden="true">＋</span> New chat</button>
        <nav class="conversation-list" id="conversation-list" aria-label="Conversation history"></nav>
        <div class="sidebar-footer">
          <button class="quiet-button" id="export-all" type="button">Export all</button>
          <button class="quiet-button" id="logout" type="button">Log out</button>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <button class="icon-button mobile-only" id="open-sidebar" aria-label="Open conversations">☰</button>
          <button class="title-button" id="edit-title" type="button" title="Edit title">
            <span id="current-title">New chat</span>
            <span class="edit-glyph" aria-hidden="true">✎</span>
          </button>
          <button class="icon-button danger-button" id="delete-chat" type="button" aria-label="Delete conversation" title="Delete conversation">⌫</button>
        </header>

        <section class="messages" id="messages" aria-live="polite">
          <div class="empty-state" id="empty-state">
            <div class="brand-mark" aria-hidden="true">✦</div>
            <h2>What can I help with?</h2>
            <p>Your messages are saved automatically.</p>
          </div>
        </section>

        <div class="composer-wrap">
          <form class="composer" id="composer-form">
            <label class="sr-only" for="message-input">Message</label>
            <textarea id="message-input" rows="1" placeholder="Message your assistant" maxlength="100000" enterkeyhint="send"></textarea>
            <button class="send-button" id="send-button" type="submit" aria-label="Send message">↑</button>
          </form>
          <p class="composer-note">AI can make mistakes. Your exact messages are stored in SQLite.</p>
        </div>
      </main>
    </div>

    <dialog id="title-dialog">
      <form method="dialog" id="title-form">
        <h2>Edit title</h2>
        <label class="sr-only" for="title-input">Conversation title</label>
        <input id="title-input" maxlength="120" required>
        <div class="dialog-actions">
          <button class="quiet-button" value="cancel" type="button" id="cancel-title">Cancel</button>
          <button class="primary-button compact" value="save" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
